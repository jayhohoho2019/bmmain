<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.85);
        --border-color: rgba(0, 0, 0, 0.08);
        --text-main: #0f172a;
        --text-muted: #64748b;
        --accent: #0284c7;
        --accent-glow: rgba(2, 132, 199, 0.15);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      padding: 3rem 2.5rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.2);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--accent);
      background: var(--accent-glow);
      margin-bottom: 1.75rem;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: "";
      position: absolute;
      top: -3px;
      left: -3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.6;
      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .divider {
      height: 1px;
      background: var(--border-color);
      margin: 1.75rem 0;
    }

    .contact {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="status-badge">
      <span class="pulse-dot"></span>
      Scheduled Maintenance
    </div>

    <h1>We'll be right back</h1>
    
    <p>
      The site is currently undergoing planned updates and improvements. Everything will be back up and running shortly.
    </p>

    <div class="divider"></div>

    <div class="contact">
      Need urgent assistance? Reach out at <a href="mailto:web@buildmore-solutions.com">web@buildmore-solutions.com</a>
    </div>
  </main>

</body>
</html>
